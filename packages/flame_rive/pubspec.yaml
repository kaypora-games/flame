name: flame_rive
resolution: workspace
description: Rive support for the Flame game engine. This uses the rive package and provides wrappers and components to be used inside Flame.
homepage: https://github.com/flame-engine/flame
version: 1.10.21+1 # was 1.10.21-2
funding:
  - https://opencollective.com/blue-fire
  - https://github.com/sponsors/bluefireteam
  - https://patreon.com/bluefireoss
topics:
  - flame
  - rive
  - animations

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  collection: ^1.19.1
  flame: # ^1.34.0 # pinned to stokanal
  flutter:
    sdk: flutter
  plato:
  rive: ^0.13.20 # pinned to bfut-app

dev_dependencies:
  dartdoc: ^8.0.8
  flame_lint: ^1.4.2
  flame_test: ^2.2.0
  flutter_test:
    sdk: flutter

