name: flame_rive
resolution: workspace
description: Rive support for the Flame game engine. This uses the rive package and provides wrappers and components to be used inside Flame.
homepage: https://github.com/flame-engine/flame
version: 1.11.1+4 # was 1.11.1
funding:
  - https://opencollective.com/blue-fire
  - https://github.com/sponsors/bluefireteam
  - https://patreon.com/bluefireoss
topics:
  - flame
  - rive
  - animations

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
 flutter:
    sdk: flutter

 collection: ^1.19.1
 flame: ^1.37.0
 
 plato:
   git:
     url: git@github.com:kaypora-games/plato.git
     ref: main

 stokanal:
   git:
     url: git@github.com:kaypora-games/stokanal-flutter.git
     ref: master

 rive:
   git:
     url: git@github.com:kaypora-games/rive-flutter.git
     ref: master

 rive_common:
   git:
     url: git@github.com:kaypora-games/rive-common.git
     ref: main

dev_dependencies:
  dartdoc: ^9.0.0
  flame_lint: ^1.4.3
  flame_test: ^2.2.4
  flutter_test:
    sdk: flutter