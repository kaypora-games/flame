name: flame_rive
resolution: workspace
description: Rive support for the Flame game engine. This uses the rive package and provides wrappers and components to be used inside Flame.
homepage: https://github.com/flame-engine/flame
version: 1.11.1+1 # was 1.11.1
funding:
  - https://opencollective.com/blue-fire
  - https://github.com/sponsors/bluefireteam
  - https://patreon.com/bluefireoss
topics:
  - flame
  - rive
  - animations

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  collection: ^1.19.1
  flame: ^1.37.0
  flutter:
    sdk: flutter
  plato:
  rive: ^0.13.20 # legacy rive, upstream/master has updated to rive renderer

dev_dependencies:
  dartdoc: ^9.0.0
  flame_lint: ^1.4.3
  flame_test: ^2.2.4
  flutter_test:
    sdk: flutter

